<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAWAY — Student Lifestyle & Study Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #F8FAFC;
            --surface-light: #FFFFFF;
            --text-light: #0F172A;
            --text-muted-light: #64748B;
            --border-light: #E2E8F0;

            --student-primary: #00A896;
            --student-accent: #02C39A;
            --student-light-bg: #E6FFFA;

            --teacher-primary: #2A4365;
            --teacher-accent: #3182CE;
            --teacher-light-bg: #EBF8FF;

            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }

        .dark {
            --bg-light: #0F172A;
            --surface-light: #1E293B;
            --text-light: #F8FAFC;
            --text-muted-light: #94A3B8;
            --border-light: #334155;
            --student-light-bg: #132A29;
            --teacher-light-bg: #1A202C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090D16;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12.dp;
        }

        /* Mobile App Frame Container */
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 880px;
            max-height: 95vh;
            background-color: var(--bg-light);
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 12px #1E293B;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            padding: 16px 20px;
            background-color: var(--surface-light);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .btn-switch {
            background: none;
            border: 1px solid var(--border-light);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-switch:hover {
            background-color: var(--border-light);
        }

        /* Main View Container */
        .view-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Cards */
        .card {
            background-color: var(--surface-light);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-light);
        }

        /* Welcome Screen */
        .welcome-screen {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            height: 100%;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: white;
            text-align: center;
        }

        .role-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 20px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .role-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.14);
        }

        .role-card.student {
            background: linear-gradient(135deg, var(--student-primary), var(--student-accent));
        }

        .role-card.teacher {
            background: linear-gradient(135deg, var(--teacher-primary), var(--teacher-accent));
        }

        .role-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }

        /* Privacy Switch Component */
        .privacy-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--student-light-bg);
            border: 1px solid var(--student-primary);
            border-radius: 18px;
            padding: 16px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #CBD5E1;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--student-primary);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Action Buttons */
        .btn-tick {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-green);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .btn-tick.active {
            background: var(--success-green);
            color: white;
        }

        .btn-cross {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.15);
            color: var(--error-red);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .btn-cross.active {
            background: var(--error-red);
            color: white;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            background-color: var(--surface-light);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted-light);
            cursor: pointer;
            border: none;
            background: none;
            width: 25%;
        }

        .nav-item.active {
            color: var(--student-primary);
        }

        .nav-item span.icon {
            font-size: 1.25rem;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 100%;
            background: var(--surface-light);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }

        /* Form Controls */
        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background-color: var(--bg-light);
            color: var(--text-light);
            font-size: 0.9rem;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background-color: var(--student-primary);
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-teacher {
            background-color: var(--teacher-primary);
        }
    </style>
</head>
<body>

<div class="app-container" id="appFrame">
    <!-- View rendered via JavaScript -->
</div>

<script>
    // State Management
    const state = {
        role: 'WELCOME', // WELCOME, STUDENT, TEACHER
        activeStudentId: 's1',
        themeMode: 'light',
        students: [
            { id: 's1', name: 'Alex Rivers', avatar: '🎓', consistency: 92, visibleToTeacher: true },
            { id: 's2', name: 'Maya Lin', avatar: '🚀', consistency: 88, visibleToTeacher: false },
            { id: 's3', name: 'Jordan Vance', avatar: '🎨', consistency: 74, visibleToTeacher: true }
        ],
        routine: [
            { id: 'r1', title: 'Morning Yoga & Meditation', time: '07:00 AM - 07:30 AM', category: 'Wellness', status: 'COMPLETED' },
            { id: 'r2', title: 'Math Problem Set Review', time: '09:00 AM - 10:30 AM', category: 'Study', status: 'COMPLETED' },
            { id: 'r3', title: 'Physics Chapter 4 Summary', time: '02:00 PM - 03:30 PM', category: 'Study', status: 'PENDING' },
            { id: 'r4', title: 'Evening Walk & Hydration', time: '06:00 PM - 06:45 PM', category: 'Fitness', status: 'PENDING' }
        ],
        tasks: [
            {
                id: 't1',
                title: 'Calculus Derivatives Worksheet',
                subject: 'Mathematics',
                dueDate: 'Today, 5:00 PM',
                instructions: 'Complete exercises 1 to 15 on page 142. Show all step-by-step working.',
                assignedTo: null,
                status: 'PENDING',
                reason: null
            },
            {
                id: 't2',
                title: 'Physics Lab Report: Optics',
                subject: 'Physics',
                dueDate: 'Tomorrow, 11:59 PM',
                instructions: 'Write up experimental observations and error analysis.',
                assignedTo: 's1',
                status: 'REASON_SUBMITTED',
                reason: {
                    submittedBy: 'PARENT',
                    tag: 'Unwell / Sick',
                    note: 'Alex had a fever last night and was advised rest. Requesting 1-day extension.'
                }
            }
        ],
        wellness: {
            water: 5,
            targetWater: 8,
            mood: '😊 Focused'
        },
        pomodoro: {
            mode: 'FOCUS', // FOCUS (25m), BREAK (5m)
            seconds: 1500,
            isRunning: false,
            interval: null,
            sessions: 3
        },
        studentTab: 0, // 0: Dash, 1: Routine, 2: Tasks, 3: Focus
        teacherTab: 0, // 0: Feed, 1: Assign, 2: Routines
        modalTask: null
    };

    function render() {
        const frame = document.getElementById('appFrame');
        if (state.role === 'WELCOME') {
            frame.innerHTML = renderWelcomeScreen();
        } else if (state.role === 'STUDENT') {
            frame.innerHTML = renderStudentInterface();
        } else if (state.role === 'TEACHER') {
            frame.innerHTML = renderTeacherInterface();
        }
    }

    // WELCOME SCREEN
    function renderWelcomeScreen() {
        return `
        <div class="welcome-screen">
            <div>
                <div style="font-size: 3rem; margin-bottom: 10px;">✨</div>
                <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: 2px;">AURAWAY</h1>
                <p style="opacity: 0.7; font-size: 0.9rem;">Student Lifestyle & Study Management</p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 16px;">
                <p style="text-align: left; font-size: 0.85rem; opacity: 0.8; font-weight: 600;">SELECT YOUR ROLE</p>
                <div class="role-card student" onclick="selectRole('STUDENT')">
                    <div class="role-icon">🧑‍🎓</div>
                    <div>
                        <h3 style="font-size: 1.1rem; font-weight: 700;">Student Portal</h3>
                        <p style="font-size: 0.8rem; opacity: 0.9;">Pomodoro, routine & task manager</p>
                    </div>
                </div>

                <div class="role-card teacher" onclick="selectRole('TEACHER')">
                    <div class="role-icon">👨‍🏫</div>
                    <div>
                        <h3 style="font-size: 1.1rem; font-weight: 700;">Teacher Portal</h3>
                        <p style="font-size: 0.8rem; opacity: 0.9;">Assign tasks & verify reason notes</p>
                    </div>
                </div>
            </div>

            <div>
                <p style="font-size: 0.75rem; opacity: 0.6; margin-bottom: 8px;">ACTIVE DEMO STUDENT</p>
                <div style="display: flex; justify-content: center; gap: 8px;">
                    ${state.students.map(s => `
                        <button style="padding: 6px 12px; border-radius: 20px; border: none; background: ${s.id === state.activeStudentId ? 'var(--student-primary)' : 'rgba(255,255,255,0.1)'}; color: white; cursor: pointer; font-size: 0.75rem; font-weight: 600;" onclick="setActiveStudent('${s.id}')">
                            ${s.avatar} ${s.name.split(' ')[0]}
                        </button>
                    `).join('')}
                </div>
            </div>
        </div>
        `;
    }

    // STUDENT INTERFACE
    function renderStudentInterface() {
        const student = state.students.find(s => s.id === state.activeStudentId) || state.students[0];

        return `
        <div class="top-bar">
            <div class="brand-logo" style="color: var(--student-primary);">
                AURAWAY <span class="role-badge" style="background: var(--student-light-bg); color: var(--student-primary);">STUDENT</span>
            </div>
            <button class="btn-switch" onclick="selectRole('WELCOME')">Switch Role</button>
        </div>

        <div class="view-content">
            ${state.studentTab === 0 ? renderStudentDash(student) : ''}
            ${state.studentTab === 1 ? renderStudentRoutine(student) : ''}
            ${state.studentTab === 2 ? renderStudentTasks() : ''}
            ${state.studentTab === 3 ? renderStudentFocus() : ''}
        </div>

        <div class="bottom-nav">
            <button class="nav-item ${state.studentTab === 0 ? 'active' : ''}" onclick="setStudentTab(0)">
                <span class="icon">📊</span> Dashboard
            </button>
            <button class="nav-item ${state.studentTab === 1 ? 'active' : ''}" onclick="setStudentTab(1)">
                <span class="icon">📅</span> Routine
            </button>
            <button class="nav-item ${state.studentTab === 2 ? 'active' : ''}" onclick="setStudentTab(2)">
                <span class="icon">📝</span> Tasks
            </button>
            <button class="nav-item ${state.studentTab === 3 ? 'active' : ''}" onclick="setStudentTab(3)">
                <span class="icon">⏱️</span> Focus
            </button>
        </div>

        ${renderReasonModal()}
        `;
    }

    function renderStudentDash(student) {
        const completedRoutines = state.routine.filter(r => r.status === 'COMPLETED').length;
        const pendingTasks = state.tasks.filter(t => t.status === 'PENDING').length;

        return `
        <div style="background: linear-gradient(135deg, var(--student-primary), var(--student-accent)); border-radius: 24px; padding: 24px; color: white;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 style="font-size: 1.4rem; font-weight: 800;">Hello, ${student.name} ${student.avatar}</h2>
                    <p style="font-size: 0.85rem; opacity: 0.9;">Wednesday, Feb 26</p>
                </div>
                <div style="width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.25); display: flex; flex-direction: column; justify-content: center; align-items: center;">
                    <span style="font-weight: 800; font-size: 1.1rem;">${student.consistency}%</span>
                    <span style="font-size: 0.55rem; text-transform: uppercase;">Streak</span>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 12px;">
            <div class="card" style="flex: 1; cursor: pointer;" onclick="setStudentTab(1)">
                <p style="font-size: 0.75rem; color: var(--text-muted-light); font-weight: 600;">DAILY ROUTINE</p>
                <h3 style="font-size: 1.1rem; color: var(--student-primary); font-weight: 700; margin: 4px 0;">${completedRoutines} / ${state.routine.length} Done</h3>
                <p style="font-size: 0.7rem; color: var(--text-muted-light);">${student.visibleToTeacher ? '👁️ Shared with Teacher' : '🔒 Private'}</p>
            </div>
            <div class="card" style="flex: 1; cursor: pointer;" onclick="setStudentTab(2)">
                <p style="font-size: 0.75rem; color: var(--text-muted-light); font-weight: 600;">ASSIGNED TASKS</p>
                <h3 style="font-size: 1.1rem; color: var(--teacher-accent); font-weight: 700; margin: 4px 0;">${pendingTasks} Pending</h3>
                <p style="font-size: 0.7rem; color: var(--text-muted-light);">Click to manage</p>
            </div>
        </div>

        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h4 style="font-size: 0.95rem; font-weight: 700;">💧 Water Hydration Goal</h4>
                <p style="font-size: 0.85rem; color: var(--text-muted-light);">${state.wellness.water} / ${state.wellness.targetWater} Glasses Hydrated</p>
            </div>
            <button class="btn-primary" style="width: auto; padding: 8px 16px;" onclick="addWater()">+ Glass</button>
        </div>
        `;
    }

    function renderStudentRoutine(student) {
        return `
        <div class="privacy-card">
            <div>
                <h4 style="font-size: 0.95rem; font-weight: 700; color: var(--text-light);">Visible to Teacher</h4>
                <p style="font-size: 0.75rem; color: var(--text-muted-light);">
                    ${student.visibleToTeacher ? 'Teacher can view your active routine' : 'Private mode: Routine is hidden from teacher'}
                </p>
            </div>
            <label class="switch">
                <input type="checkbox" ${student.visibleToTeacher ? 'checked' : ''} onchange="toggleRoutinePrivacy(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <h3 style="font-size: 1.1rem; font-weight: 700;">Daily Time Blocks</h3>

        <div style="display: flex; flex-direction: column; gap: 12px;">
            ${state.routine.map(item => `
                <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-left: 4px solid ${item.status === 'COMPLETED' ? 'var(--success-green)' : (item.status === 'MISSED' ? 'var(--error-red)' : 'var(--border-light)')}">
                    <div>
                        <span style="font-size: 0.65rem; font-weight: 700; background: var(--student-light-bg); color: var(--student-primary); padding: 2px 6px; border-radius: 4px;">${item.category}</span>
                        <span style="font-size: 0.75rem; color: var(--text-muted-light); margin-left: 6px;">${item.time}</span>
                        <h4 style="font-size: 0.95rem; font-weight: 700; margin-top: 4px;">${item.title}</h4>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-tick ${item.status === 'COMPLETED' ? 'active' : ''}" onclick="toggleRoutineStatus('${item.id}', 'COMPLETED')">✓</button>
                        <button class="btn-cross ${item.status === 'MISSED' ? 'active' : ''}" onclick="toggleRoutineStatus('${item.id}', 'MISSED')">✕</button>
                    </div>
                </div>
            `).join('')}
        </div>
        `;
    }

    function renderStudentTasks() {
        return `
        <h3 style="font-size: 1.1rem; font-weight: 700;">Assigned Homework</h3>
        <div style="display: flex; flex-direction: column; gap: 14px;">
            ${state.tasks.map(task => `
                <div class="card" style="display: flex; flex-direction: column; gap: 10px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 0.7rem; font-weight: 700; color: var(--student-primary); background: var(--student-light-bg); padding: 3px 8px; border-radius: 6px;">${task.subject}</span>
                        <span style="font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: ${task.status === 'DONE' ? 'var(--success-green)' : (task.status === 'REASON_SUBMITTED' ? 'var(--warning-orange)' : 'var(--border-light)')}; color: white;">${task.status}</span>
                    </div>

                    <h4 style="font-size: 1rem; font-weight: 700;">${task.title}</h4>
                    <p style="font-size: 0.85rem; color: var(--text-muted-light);">${task.instructions}</p>
                    <p style="font-size: 0.75rem; color: var(--text-muted-light);">⏱️ Due: ${task.dueDate}</p>

                    ${task.status === 'REASON_SUBMITTED' ? `
                        <div style="background: rgba(245, 158, 11, 0.1); border-radius: 10px; padding: 10px; font-size: 0.8rem; color: var(--warning-orange);">
                            <strong>📌 Note Submitted (${task.reason.submittedBy}):</strong> "${task.reason.note}"
                        </div>
                    ` : ''}

                    ${task.status === 'PENDING' || task.status === 'REASON_SUBMITTED' ? `
                        <div style="display: flex; gap: 10px; margin-top: 6px;">
                            <button class="btn-primary" style="flex: 1; background: var(--success-green);" onclick="markTaskDone('${task.id}')">Mark Done</button>
                            <button class="btn-primary" style="flex: 1; background: none; border: 1px solid var(--error-red); color: var(--error-red);" onclick="openReasonModal('${task.id}')">Submit Reason</button>
                        </div>
                    ` : ''}
                </div>
            `).join('')}
        </div>
        `;
    }

    function renderStudentFocus() {
        const mins = String(Math.floor(state.pomodoro.seconds / 60)).padStart(2, '0');
        const secs = String(state.pomodoro.seconds % 60).padStart(2, '0');

        return `
        <div style="text-align: center;">
            <h3 style="font-size: 1.3rem; font-weight: 800;">Pomodoro Focus Hub</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted-light);">25m Study Focus / 5m Break</p>
        </div>

        <div style="width: 220px; height: 220px; border-radius: 50%; border: 12px solid var(--student-primary); margin: 20px auto; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <span style="font-size: 3rem; font-weight: 800; color: var(--student-primary);">${mins}:${secs}</span>
            <span style="font-size: 0.8rem; color: var(--text-muted-light);">${state.pomodoro.isRunning ? 'In Progress' : 'Paused'}</span>
        </div>

        <div style="display: flex; justify-content: center; gap: 16px;">
            <button class="btn-primary" style="width: auto; padding: 12px 32px;" onclick="toggleTimer()">${state.pomodoro.isRunning ? 'Pause' : 'Start Focus'}</button>
            <button class="btn-switch" style="padding: 12px 20px;" onclick="resetTimer()">Reset</button>
        </div>
        `;
    }

    // TEACHER INTERFACE
    function renderTeacherInterface() {
        return `
        <div class="top-bar">
            <div class="brand-logo" style="color: var(--teacher-primary);">
                AURAWAY <span class="role-badge" style="background: var(--teacher-light-bg); color: var(--teacher-primary);">TEACHER</span>
            </div>
            <button class="btn-switch" onclick="selectRole('WELCOME')">Switch Role</button>
        </div>

        <div class="view-content">
            ${state.teacherTab === 0 ? renderTeacherFeed() : ''}
            ${state.teacherTab === 1 ? renderTeacherAssign() : ''}
            ${state.teacherTab === 2 ? renderTeacherRoutines() : ''}
        </div>

        <div class="bottom-nav">
            <button class="nav-item ${state.teacherTab === 0 ? 'active' : ''}" style="${state.teacherTab === 0 ? 'color: var(--teacher-primary);' : ''}" onclick="setTeacherTab(0)">
                <span class="icon">🔍</span> Reason Feed
            </button>
            <button class="nav-item ${state.teacherTab === 1 ? 'active' : ''}" style="${state.teacherTab === 1 ? 'color: var(--teacher-primary);' : ''}" onclick="setTeacherTab(1)">
                <span class="icon">➕</span> Assign Work
            </button>
            <button class="nav-item ${state.teacherTab === 2 ? 'active' : ''}" style="${state.teacherTab === 2 ? 'color: var(--teacher-primary);' : ''}" onclick="setTeacherTab(2)">
                <span class="icon">👁️</span> Student Routines
            </button>
        </div>
        `;
    }

    function renderTeacherFeed() {
        return `
        <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--teacher-primary);">Live Student Progress & Reason Feed</h3>

        <div style="display: flex; flex-direction: column; gap: 14px;">
            ${state.tasks.map(task => `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <strong style="color: var(--teacher-primary); font-size: 0.9rem;">Alex Rivers (🎓 Student)</strong>
                        <span style="font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: ${task.status === 'REASON_SUBMITTED' ? 'var(--warning-orange)' : 'var(--border-light)'}; color: white;">${task.status}</span>
                    </div>

                    <h4 style="font-weight: 700;">${task.title}</h4>
                    <p style="font-size: 0.8rem; color: var(--text-muted-light);">Due: ${task.dueDate}</p>

                    ${task.reason ? `
                        <div style="background: rgba(245, 158, 11, 0.12); padding: 12px; border-radius: 12px; margin-top: 8px;">
                            <strong style="color: var(--warning-orange); font-size: 0.8rem;">Note Submitted by ${task.reason.submittedBy}:</strong>
                            <p style="font-size: 0.85rem; margin-top: 2px;">"${task.reason.note}"</p>
                        </div>
                    ` : ''}

                    ${task.status === 'REASON_SUBMITTED' ? `
                        <div style="display: flex; gap: 8px; margin-top: 12px;">
                            <button class="btn-primary btn-teacher" style="flex: 1; background: var(--success-green);" onclick="excuseTask('${task.id}')">Verify & Excuse</button>
                            <button class="btn-primary btn-teacher" style="flex: 1; background: var(--teacher-primary);" onclick="extendTask('${task.id}')">Extend Deadline</button>
                        </div>
                    ` : ''}
                </div>
            `).join('')}
        </div>
        `;
    }

    function renderTeacherAssign() {
        return `
        <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--teacher-primary);">Assign Task to Students</h3>
        <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
            <input type="text" id="taskTitle" placeholder="Task Title (e.g. History Chapter Summary)">
            <input type="text" id="taskSubject" placeholder="Subject (e.g. History)">
            <input type="text" id="taskDue" placeholder="Due Date (e.g. Friday, 5 PM)">
            <textarea id="taskInstructions" rows="3" placeholder="Short Instructions..."></textarea>
            <button class="btn-primary btn-teacher" onclick="createTask()">Dispatch Homework Task</button>
        </div>
        `;
    }

    function renderTeacherRoutines() {
        const student = state.students.find(s => s.id === state.activeStudentId);
        return `
        <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--teacher-primary);">Student Routine Inspector</h3>

        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            ${state.students.map(s => `
                <button style="padding: 6px 12px; border-radius: 12px; border: 1px solid var(--border-light); background: ${s.id === state.activeStudentId ? 'var(--teacher-primary)' : 'var(--surface-light)'}; color: ${s.id === state.activeStudentId ? 'white' : 'var(--text-light)'}; cursor: pointer;" onclick="setActiveStudent('${s.id}')">
                    ${s.avatar} ${s.name.split(' ')[0]}
                </button>
            `).join('')}
        </div>

        ${!student.visibleToTeacher ? `
            <div class="card" style="text-align: center; padding: 30px 20px;">
                <span style="font-size: 2.5rem;">🔒</span>
                <h4 style="font-size: 1.1rem; font-weight: 700; margin-top: 10px;">Routine is Private</h4>
                <p style="font-size: 0.85rem; color: var(--text-muted-light); margin-top: 4px;">
                    ${student.name} has disabled teacher visibility for their routine.
                </p>
            </div>
        ` : `
            <div style="display: flex; flex-direction: column; gap: 10px;">
                ${state.routine.map(item => `
                    <div class="card" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
                        <div>
                            <span style="font-size: 0.75rem; color: var(--text-muted-light);">${item.time}</span>
                            <h4 style="font-size: 0.9rem; font-weight: 700;">${item.title}</h4>
                        </div>
                        <span style="font-weight: 700; font-size: 0.8rem; color: ${item.status === 'COMPLETED' ? 'var(--success-green)' : 'var(--error-red)'}">${item.status}</span>
                    </div>
                `).join('')}
            </div>
        `}
        `;
    }

    function renderReasonModal() {
        return `
        <div class="modal-overlay ${state.modalTask ? 'open' : ''}">
            <div class="modal-content">
                <h3 style="font-size: 1.1rem; font-weight: 700;">Submit Reason Note</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted-light);">Select who is submitting and reason tag:</p>

                <select id="modalSubmitter">
                    <option value="STUDENT">🧑‍🎓 Student Submission</option>
                    <option value="PARENT">👨‍👩‍👦 Parent / Guardian Submission</option>
                </select>

                <select id="modalReasonTag">
                    <option value="Unwell / Sick">Unwell / Sick</option>
                    <option value="Family Event / Emergency">Family Event / Emergency</option>
                    <option value="Need Academic Help">Need Academic Help</option>
                </select>

                <textarea id="modalNote" rows="2" placeholder="Explain brief details for teacher..."></textarea>

                <div style="display: flex; gap: 10px;">
                    <button class="btn-primary" style="background: var(--border-light); color: var(--text-light);" onclick="closeModal()">Cancel</button>
                    <button class="btn-primary" onclick="submitReason()">Submit Note</button>
                </div>
            </div>
        </div>
        `;
    }

    // Handlers
    function selectRole(role) { state.role = role; render(); }
    function setActiveStudent(id) { state.activeStudentId = id; render(); }
    function setStudentTab(tab) { state.studentTab = tab; render(); }
    function setTeacherTab(tab) { state.teacherTab = tab; render(); }

    function toggleRoutinePrivacy(val) {
        const student = state.students.find(s => s.id === state.activeStudentId);
        if (student) student.visibleToTeacher = val;
        render();
    }

    function toggleRoutineStatus(id, status) {
        const item = state.routine.find(r => r.id === id);
        if (item) item.status = (item.status === status) ? 'PENDING' : status;
        render();
    }

    function markTaskDone(id) {
        const task = state.tasks.find(t => t.id === id);
        if (task) task.status = 'DONE';
        render();
    }

    function openReasonModal(id) { state.modalTask = id; render(); }
    function closeModal() { state.modalTask = null; render(); }

    function submitReason() {
        const task = state.tasks.find(t => t.id === state.modalTask);
        if (task) {
            task.status = 'REASON_SUBMITTED';
            task.reason = {
                submittedBy: document.getElementById('modalSubmitter').value,
                tag: document.getElementById('modalReasonTag').value,
                note: document.getElementById('modalNote').value || 'Reason submitted.'
            };
        }
        closeModal();
    }

    function excuseTask(id) {
        const task = state.tasks.find(t => t.id === id);
        if (task) task.status = 'EXCUSED';
        render();
    }

    function extendTask(id) {
        const task = state.tasks.find(t => t.id === id);
        if (task) { task.status = 'EXTENDED'; task.dueDate = 'Extended by 2 Days'; }
        render();
    }

    function createTask() {
        const title = document.getElementById('taskTitle').value;
        const subject = document.getElementById('taskSubject').value;
        const due = document.getElementById('taskDue').value;
        const inst = document.getElementById('taskInstructions').value;
        if (title) {
            state.tasks.unshift({
                id: 't' + Date.now(),
                title: title,
                subject: subject || 'General',
                dueDate: due || 'Tomorrow',
                instructions: inst || 'No instructions',
                status: 'PENDING',
                reason: null
            });
            setTeacherTab(0);
        }
    }

    function addWater() {
        state.wellness.water = Math.min(state.wellness.targetWater, state.wellness.water + 1);
        render();
    }

    function toggleTimer() {
        if (state.pomodoro.isRunning) {
            clearInterval(state.pomodoro.interval);
            state.pomodoro.isRunning = false;
        } else {
            state.pomodoro.isRunning = true;
            state.pomodoro.interval = setInterval(() => {
                if (state.pomodoro.seconds > 0) {
                    state.pomodoro.seconds--;
                } else {
                    clearInterval(state.pomodoro.interval);
                    state.pomodoro.isRunning = false;
                }
                render();
            }, 1000);
        }
        render();
    }

    function resetTimer() {
        clearInterval(state.pomodoro.interval);
        state.pomodoro.isRunning = false;
        state.pomodoro.seconds = 1500;
        render();
    }

    render();
</script>
</body>
</html>

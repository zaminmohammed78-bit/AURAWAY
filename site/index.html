<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAWAY — Student Lifestyle & Study Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-light: #0F172A;
            --surface-light: #1E293B;
            --text-light: #F8FAFC;
            --text-muted-light: #94A3B8;
            --border-light: #334155;

            --student-primary: #00A896;
            --student-accent: #02C39A;
            --student-light-bg: #132A29;

            --teacher-primary: #2A4365;
            --teacher-accent: #3182CE;
            --teacher-light-bg: #1A202C;

            --success-green: #10B981;
            --error-red: #EF4444;
            --warning-orange: #F59E0B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090D16;
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        /* Mobile App Frame Container */
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 880px;
            max-height: 95vh;
            background-color: var(--bg-light);
            border-radius: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 12px #1E293B;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            padding: 16px 20px;
            background-color: var(--surface-light);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .btn-switch {
            background: none;
            border: 1px solid var(--border-light);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted-light);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-switch:hover {
            background-color: var(--border-light);
        }

        /* Main View Container */
        .view-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Cards */
        .card {
            background-color: var(--surface-light);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-light);
        }

        /* Auth Screen */
        .auth-screen {
            height: 100%;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .role-tabs {
            display: flex;
            background: var(--surface-light);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid var(--border-light);
        }

        .role-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-muted-light);
            transition: all 0.2s;
        }

        .role-tab.active-student {
            background-color: var(--student-primary);
            color: white;
        }

        .role-tab.active-teacher {
            background-color: var(--teacher-primary);
            color: white;
        }

        /* Form Controls */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted-light);
        }

        input[type="text"], input[type="email"], input[type="password"], textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background-color: var(--bg-light);
            color: var(--text-light);
            font-size: 0.9rem;
            outline: none;
        }

        .teacher-code-box {
            background: rgba(49, 130, 206, 0.15);
            border: 1px solid #3182CE;
            padding: 12px;
            border-radius: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background-color: var(--student-primary);
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-teacher {
            background-color: var(--teacher-accent);
        }

        /* Privacy Switch Component */
        .privacy-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--student-light-bg);
            border: 1px solid var(--student-primary);
            border-radius: 18px;
            padding: 16px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #CBD5E1; transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute; content: "";
            height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--student-primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Action Buttons */
        .btn-tick {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(16, 185, 129, 0.15); color: var(--success-green);
            border: none; cursor: pointer; font-size: 1rem;
            display: flex; justify-content: center; align-items: center; font-weight: bold;
        }

        .btn-tick.active { background: var(--success-green); color: white; }

        .btn-cross {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(239, 68, 68, 0.15); color: var(--error-red);
            border: none; cursor: pointer; font-size: 1rem;
            display: flex; justify-content: center; align-items: center; font-weight: bold;
        }

        .btn-cross.active { background: var(--error-red); color: white; }

        /* Bottom Navigation Bar */
        .bottom-nav {
            background-color: var(--surface-light);
            border-top: 1px solid var(--border-light);
            display: flex; justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 0.7rem; font-weight: 600; color: var(--text-muted-light);
            cursor: pointer; border: none; background: none; width: 25%;
        }

        .nav-item.active { color: var(--student-primary); }
        .nav-item span.icon { font-size: 1.25rem; }

        /* Modal Overlay */
        .modal-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); display: flex;
            justify-content: center; align-items: flex-end;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }

        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-content {
            width: 100%; background: var(--surface-light);
            border-top-left-radius: 28px; border-top-right-radius: 28px;
            padding: 24px; display: flex; flex-direction: column; gap: 16px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.open .modal-content { transform: translateY(0); }
    </style>
</head>
<body>

<div class="app-container" id="appFrame">
    <!-- View rendered via JavaScript -->
</div>

<script>
    const TEACHER_SPECIAL_CODE = '0987654321';

    // State
    const state = {
        user: null, // Logged in user profile
        isSignUp: false,
        selectedRole: 'student',
        studentTab: 0,
        teacherTab: 0,
        pomodoro: { seconds: 1500, isRunning: false, interval: null },
        modalTask: null,
        routines: [
            { id: 'r1', title: 'Morning Yoga & Meditation', time: '07:00 AM - 07:30 AM', category: 'Wellness', status: 'COMPLETED' },
            { id: 'r2', title: 'Math Problem Set Review', time: '09:00 AM - 10:30 AM', category: 'Study', status: 'COMPLETED' },
            { id: 'r3', title: 'Physics Chapter 4 Summary', time: '02:00 PM - 03:30 PM', category: 'Study', status: 'PENDING' }
        ],
        tasks: [
            { id: 't1', title: 'Calculus Derivatives Worksheet', subject: 'Mathematics', dueDate: 'Today, 5:00 PM', instructions: 'Exercises 1-15 on page 142.', status: 'PENDING', reason: null },
            { id: 't2', title: 'Physics Lab Report: Optics', subject: 'Physics', dueDate: 'Tomorrow, 11:59 PM', instructions: 'Observations and error analysis.', status: 'REASON_SUBMITTED', reason: { submittedBy: 'PARENT', note: 'Alex had a fever last night and was advised rest.' } }
        ],
        wellness: { water: 5, targetWater: 8 }
    };

    function render() {
        const frame = document.getElementById('appFrame');
        if (!state.user) {
            frame.innerHTML = renderAuthScreen();
        } else if (state.user.role === 'student') {
            frame.innerHTML = renderStudentInterface();
        } else if (state.user.role === 'teacher') {
            frame.innerHTML = renderTeacherInterface();
        }
    }

    function renderAuthScreen() {
        return `
        <div class="auth-screen">
            <div style="text-align: center; margin-top: 10px;">
                <div style="font-size: 2.5rem;">✨</div>
                <h1 style="font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; margin-top: 4px;">AURAWAY</h1>
                <p style="font-size: 0.8rem; color: var(--text-muted-light);">Student Lifestyle & Study Platform</p>
            </div>

            <div class="role-tabs">
                <div class="role-tab ${state.selectedRole === 'student' ? 'active-student' : ''}" onclick="selectRole('student')">🧑‍🎓 Student Portal</div>
                <div class="role-tab ${state.selectedRole === 'teacher' ? 'active-teacher' : ''}" onclick="selectRole('teacher')">👨‍🏫 Teacher Portal</div>
            </div>

            <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
                <h3 style="font-size: 1.1rem; font-weight: 700;">${state.isSignUp ? 'Register Account' : 'Sign In'}</h3>

                ${state.isSignUp ? `
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="authName" placeholder="e.g. Alex Rivers">
                    </div>
                ` : ''}

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="authEmail" placeholder="e.g. user@school.edu">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" placeholder="••••••••">
                </div>

                ${state.isSignUp ? `
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" id="authConfirmPassword" placeholder="••••••••">
                    </div>
                ` : ''}

                ${state.selectedRole === 'teacher' ? `
                    <div class="teacher-code-box">
                        <label style="color: #63B3ED; font-weight: 700; font-size: 0.75rem;">🔑 Teacher Security Access Key (Required: 0987654321)</label>
                        <input type="password" id="teacherCode" placeholder="Enter secret code (0987654321)" style="margin-top: 4px; border-color: #3182CE;">
                    </div>
                ` : ''}

                <button class="btn-primary ${state.selectedRole === 'teacher' ? 'btn-teacher' : ''}" onclick="handleAuth()">
                    ${state.isSignUp ? 'Create Account' : 'Sign In'}
                </button>

                <p style="text-align: center; font-size: 0.8rem; color: var(--text-muted-light); cursor: pointer;" onclick="toggleAuthMode()">
                    ${state.isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Sign Up"}
                </p>
            </div>
        </div>
        `;
    }

    function renderStudentInterface() {
        return `
        <div class="top-bar">
            <div class="brand-logo" style="color: var(--student-primary);">
                AURAWAY <span class="role-badge" style="background: var(--student-light-bg); color: var(--student-primary);">STUDENT</span>
            </div>
            <button class="btn-switch" onclick="handleSignOut()">Sign Out</button>
        </div>

        <div class="view-content">
            ${state.studentTab === 0 ? `
                <div style="background: linear-gradient(135deg, var(--student-primary), var(--student-accent)); border-radius: 24px; padding: 24px; color: white;">
                    <h2 style="font-size: 1.4rem; font-weight: 800;">Hello, ${state.user.username} 🎓</h2>
                    <p style="font-size: 0.85rem; opacity: 0.9;">Wednesday, Feb 26</p>
                </div>

                <div style="display: flex; gap: 12px;">
                    <div class="card" style="flex: 1;" onclick="state.studentTab = 1; render();">
                        <p style="font-size: 0.7rem; color: var(--text-muted-light); font-weight: 700;">DAILY ROUTINE</p>
                        <h3 style="font-size: 1.1rem; color: var(--student-primary); margin: 4px 0;">2 / 3 Done</h3>
                        <p style="font-size: 0.7rem; color: var(--text-muted-light);">${state.user.visibleToTeacher ? '👁️ Shared' : '🔒 Encrypted Private'}</p>
                    </div>
                    <div class="card" style="flex: 1;" onclick="state.studentTab = 2; render();">
                        <p style="font-size: 0.7rem; color: var(--text-muted-light); font-weight: 700;">ASSIGNED TASKS</p>
                        <h3 style="font-size: 1.1rem; color: var(--teacher-accent); margin: 4px 0;">1 Pending</h3>
                        <p style="font-size: 0.7rem; color: var(--text-muted-light);">Tap to view</p>
                    </div>
                </div>
            ` : ''}

            ${state.studentTab === 1 ? `
                <div class="privacy-card">
                    <div>
                        <h4 style="font-size: 0.95rem; font-weight: 700;">Visible to Teacher</h4>
                        <p style="font-size: 0.75rem; color: var(--text-muted-light);">
                            ${state.user.visibleToTeacher ? 'Teacher can view your active routine' : 'Private mode: Routine is strictly encrypted'}
                        </p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" ${state.user.visibleToTeacher ? 'checked' : ''} onchange="state.user.visibleToTeacher = this.checked; render();">
                        <span class="slider"></span>
                    </label>
                </div>

                <h3 style="font-size: 1.1rem; font-weight: 700;">Daily Time Blocks</h3>
                ${state.routines.map(item => `
                    <div class="card" style="display: flex; justify-content: space-between; align-items: center; border-left: 4px solid ${item.status === 'COMPLETED' ? 'var(--success-green)' : 'var(--border-light)'};">
                        <div>
                            <span style="font-size: 0.75rem; color: var(--text-muted-light);">${item.time}</span>
                            <h4 style="font-size: 0.95rem; font-weight: 700; margin-top: 2px;">${item.title}</h4>
                        </div>
                        <button class="btn-tick ${item.status === 'COMPLETED' ? 'active' : ''}" onclick="item.status = item.status === 'COMPLETED' ? 'PENDING' : 'COMPLETED'; render();">✓</button>
                    </div>
                `).join('')}
            ` : ''}

            ${state.studentTab === 2 ? `
                <h3 style="font-size: 1.1rem; font-weight: 700;">Assigned Homework</h3>
                ${state.tasks.map(task => `
                    <div class="card" style="display: flex; flex-direction: column; gap: 8px;">
                        <span style="font-size: 0.7rem; font-weight: 700; color: var(--student-primary);">${task.subject}</span>
                        <h4 style="font-size: 1rem; font-weight: 700;">${task.title}</h4>
                        <p style="font-size: 0.85rem; color: var(--text-muted-light);">${task.instructions}</p>
                        ${task.status === 'PENDING' ? `
                            <button class="btn-primary" style="background: var(--success-green); margin-top: 6px;" onclick="task.status = 'DONE'; render();">Mark Done</button>
                        ` : '<p style="color: var(--success-green); font-weight: 700;">✓ Status: ' + task.status + '</p>'}
                    </div>
                `).join('')}
            ` : ''}
        </div>

        <div class="bottom-nav">
            <button class="nav-item ${state.studentTab === 0 ? 'active' : ''}" onclick="state.studentTab = 0; render();"><span class="icon">📊</span> Dash</button>
            <button class="nav-item ${state.studentTab === 1 ? 'active' : ''}" onclick="state.studentTab = 1; render();"><span class="icon">📅</span> Routine</button>
            <button class="nav-item ${state.studentTab === 2 ? 'active' : ''}" onclick="state.studentTab = 2; render();"><span class="icon">📝</span> Tasks</button>
        </div>
        `;
    }

    function renderTeacherInterface() {
        return `
        <div class="top-bar">
            <div class="brand-logo" style="color: var(--teacher-accent);">
                AURAWAY <span class="role-badge" style="background: var(--teacher-light-bg); color: var(--teacher-accent);">TEACHER</span>
            </div>
            <button class="btn-switch" onclick="handleSignOut()">Sign Out</button>
        </div>

        <div class="view-content">
            <h3 style="font-size: 1.1rem; font-weight: 700; color: var(--teacher-accent);">Teacher Control Portal</h3>
            <div class="card">
                <p style="font-size: 0.9rem;">Welcome, <strong>${state.user.username}</strong>!</p>
                <p style="font-size: 0.8rem; color: var(--text-muted-light); margin-top: 4px;">Authenticated with secret access key verification.</p>
            </div>

            <div class="card" style="display: flex; flex-direction: column; gap: 10px;">
                <h4 style="font-weight: 700;">Dispatch Homework Task</h4>
                <input type="text" id="tTitle" placeholder="Task Title">
                <input type="text" id="tSub" placeholder="Subject">
                <button class="btn-primary btn-teacher" onclick="alert('Task dispatched to all students!');">Dispatch Task</button>
            </div>
        </div>
        `;
    }

    // Handlers
    function selectRole(role) { state.selectedRole = role; render(); }
    function toggleAuthMode() { state.isSignUp = !state.isSignUp; render(); }

    function handleAuth() {
        const email = document.getElementById('authEmail')?.value;
        const password = document.getElementById('authPassword')?.value;
        const confirmPass = document.getElementById('authConfirmPassword')?.value;

        if (state.isSignUp && password !== confirmPass) {
            alert('Password and Confirm Password do not match!');
            return;
        }

        // TEACHER SECURITY PASSWORD GATE CHECK
        if (state.selectedRole === 'teacher') {
            const code = document.getElementById('teacherCode')?.value;
            if (code !== TEACHER_SPECIAL_CODE) {
                alert('Security Check Failed 🔒: Invalid Teacher Access Code. Access requires the secret key (0987654321).');
                return;
            }
        }

        const name = document.getElementById('authName')?.value || email?.split('@')[0] || 'User';
        state.user = {
            username: name,
            email: email || 'user@school.edu',
            role: state.selectedRole,
            visibleToTeacher: false
        };
        render();
    }

    function handleSignOut() {
        state.user = null;
        render();
    }

    render();
</script>
</body>
</html>
